name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Add NSIS to PATH
        run: '"C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append'

      - name: Build
        run: wails build -nsis

      - uses: actions/upload-artifact@v7
        with:
          name: lyrica-windows
          path: build/bin/lyrica-amd64-installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (universal binary)
        run: wails build --platform darwin/universal

      - name: Zip app bundle
        run: cd build/bin && zip -r lyrica-macos.zip lyrica.app

      - uses: actions/upload-artifact@v7
        with:
          name: lyrica-macos
          path: build/bin/lyrica-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: lyrica-windows
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: lyrica-macos
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
