name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Add NSIS to PATH
        run: '"C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append'

      - name: Build NSIS installer
        run: wails build -nsis -ldflags "-X main.googleClientID=${{ secrets.GOOGLE_CLIENT_ID }} -X main.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}"

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Zip portable binary
        run: Compress-Archive -Path build/bin/lyrica.exe -DestinationPath "build/bin/lyrica-${{ steps.version.outputs.tag }}-windows-amd64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: lyrica-windows
          path: |
            build/bin/lyrica-amd64-installer.exe
            build/bin/lyrica-${{ steps.version.outputs.tag }}-windows-amd64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (universal binary)
        run: wails build --platform darwin/universal -ldflags "-X main.googleClientID=${{ secrets.GOOGLE_CLIENT_ID }} -X main.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}"

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Zip app bundle
        run: cd build/bin && zip -r "lyrica-${{ steps.version.outputs.tag }}-darwin-universal.zip" lyrica.app

      - uses: actions/upload-artifact@v7
        with:
          name: lyrica-macos
          path: build/bin/lyrica-${{ steps.version.outputs.tag }}-darwin-universal.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: lyrica-windows
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: lyrica-macos
          path: artifacts

      - name: Generate SHA-256 checksums
        run: |
          sha256sum artifacts/lyrica-amd64-installer.exe | awk '{print $1 "  lyrica-amd64-installer.exe"}' > artifacts/lyrica-amd64-installer.exe.sha256
          sha256sum "artifacts/lyrica-${{ steps.version.outputs.tag }}-windows-amd64.zip" | awk "{print \$1 \"  lyrica-${{ steps.version.outputs.tag }}-windows-amd64.zip\"}" > "artifacts/lyrica-${{ steps.version.outputs.tag }}-windows-amd64.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
